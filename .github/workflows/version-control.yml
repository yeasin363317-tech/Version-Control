name: Version-Control

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find zip
        id: find
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "No zip found. Nothing to do."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Using: $ZIP"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          fi

      - name: Backup current version (tag)
        if: steps.find.outputs.found == 'true'
        run: |
          TAG="backup-$(date -u +%Y%m%d-%H%M%S)"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Backup tag: $TAG"

      - name: Unzip and update files
        if: steps.find.outputs.found == 'true'
        run: |
          rm -rf _tmp && mkdir _tmp
          unzip -q "${{ steps.find.outputs.zip }}" -d _tmp
          SRC=_tmp
          if [ "$(ls -1A _tmp | wc -l)" = "1" ] && [ -d "_tmp/$(ls -1A _tmp)" ]; then
            SRC="_tmp/$(ls -1A _tmp)"
          fi
          rsync -a --exclude='.git' --exclude='.github' "$SRC"/ ./
          rm -rf _tmp
          rm -f *.zip

      - name: Commit and push
        if: steps.find.outputs.found == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update project via Version-Control ($(date -u +%Y-%m-%d\ %H:%M))"
            git push
          fi
